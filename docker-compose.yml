version: '3.8'
services:
  ff-server:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/ffserver
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change_this_secret
    depends_on:
      - db
      - redis
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ffserver
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
volumes:
  db-data:
  redis-data:
