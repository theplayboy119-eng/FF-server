syntax = "proto3";

package game.v1;

message Handshake {
  string client_version = 1;
  string device_id = 2;
  string auth_token = 3; // optional
}

message Input {
  uint64 tick = 1;
  string player_id = 2;
  repeated Action actions = 3;
}

message Action {
  uint32 id = 1;
  bytes payload = 2;
}

message Snapshot {
  uint64 tick = 1;
  repeated EntityState entities = 2;
}

message EntityState {
  string id = 1;
  float x = 2;
  float y = 3;
  uint32 hp = 4;
}
